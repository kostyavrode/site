<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="PRPqlizLVA5_5EYBf2n--OGEU-3jwQdbdv4002o7UH0" />
    
    <!-- SEO Meta Tags -->
    <title>Вход - Audio Chat | Бесплатный голосовой чат</title>
    <meta name="description" content="Войдите в Audio Chat - бесплатный голосовой чат на русском языке. Аналог Discord для голосового общения.">
    <meta name="keywords" content="аудио чат вход, audio chat login, голосовой чат, аналог discord">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://audio-chat.ru/login.html">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Вход - Audio Chat">
    <meta property="og:description" content="Войдите в Audio Chat - бесплатный голосовой чат на русском языке.">
    <meta property="og:url" content="https://audio-chat.ru/login.html">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="css/main.css">
    <script>
        // Динамическое изменение названия в зависимости от домена
        document.addEventListener('DOMContentLoaded', function() {
            const hostname = window.location.hostname;
            const brandElement = document.getElementById('navbarBrand');
            
            if (brandElement) {
                if (hostname.includes('audio-chat.ru')) {
                    brandElement.textContent = 'Audio Chat';
                } else if (hostname.includes('audio-kostya.online')) {
                    brandElement.textContent = 'Audio Kostya';
                }
                // По умолчанию остается "Audio Kostya" если домен не распознан
            }
        });
    </script>
</head>
<body>
    <div class="page-container">
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand" id="navbarBrand">Audio Kostya</div>
                <ul class="navbar-nav">
                    <li><a href="register.html">Регистрация</a></li>
                </ul>
            </div>
        </nav>

        <main class="content">
            <div class="container" style="max-width: 500px;">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Вход</h2>
                    </div>
                    <div class="card-body">
                        <form id="loginForm">
                            <div class="form-group">
                                <label class="form-label" for="nickName">Никнейм</label>
                                <input 
                                    type="text" 
                                    id="nickName" 
                                    name="nickName" 
                                    class="form-input" 
                                    required
                                    autocomplete="username"
                                    autofocus
                                >
                                <div class="form-error" id="nickNameError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">Пароль</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    required
                                    autocomplete="current-password"
                                >
                                <div class="form-error" id="passwordError"></div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary" style="width: 100%;">
                                    Войти
                                </button>
                            </div>

                            <div class="text-center">
                                <p style="color: var(--text-secondary); font-size: 13px;">
                                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Проверка, не авторизован ли уже пользователь
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                if (await Auth.isAuthenticated()) {
                    window.location.href = 'groups.html';
                }
            } catch (error) {
                // Игнорируем ошибки при проверке - пользователь просто не авторизован
                console.log('User not authenticated');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            document.querySelectorAll('.form-error').forEach(el => {
                el.textContent = '';
            });

            const nickName = document.getElementById('nickName').value.trim();
            const password = document.getElementById('password').value;

            let hasError = false;

            if (!nickName) {
                document.getElementById('nickNameError').textContent = 'Никнейм обязателен';
                hasError = true;
            }

            if (!password) {
                document.getElementById('passwordError').textContent = 'Пароль обязателен';
                hasError = true;
            }

            if (hasError) return;

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Вход...';

            try {
                await Auth.login(nickName, password);
                
                // Проверяем, что токен установился
                const token = API.getToken();
                console.log('🔑 Токен после логина:', token ? '✅ Найден' : '❌ НЕ НАЙДЕН');
                console.log('🍪 Все cookies:', document.cookie);
                
                if (!token) {
                    console.error('❌ КРИТИЧЕСКАЯ ОШИБКА: Токен не установился после логина!');
                    Utils.showError('Ошибка: токен не был установлен. Попробуйте еще раз.');
                    submitButton.disabled = false;
                    submitButton.textContent = 'Войти';
                    return;
                }
                
                setTimeout(() => {
                    window.location.href = 'groups.html';
                }, 1000);
            } catch (error) {
                console.error('Ошибка логина:', error);
                submitButton.disabled = false;
                submitButton.textContent = 'Войти';
            }
        });
    </script>
</body>
</html>
