<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Регистрация - Audio Chat | Бесплатный голосовой чат</title>
    <meta name="description" content="Зарегистрируйтесь в Audio Chat бесплатно. Голосовой чат на русском языке - аналог Discord для общения голосом.">
    <meta name="keywords" content="аудио чат регистрация, audio chat, голосовой чат бесплатно, аналог discord регистрация">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://audio-chat.ru/register.html">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Регистрация - Audio Chat">
    <meta property="og:description" content="Зарегистрируйтесь в Audio Chat бесплатно - голосовой чат на русском языке.">
    <meta property="og:url" content="https://audio-chat.ru/register.html">
    <meta property="og:type" content="website">
    
    <link rel="stylesheet" href="css/main.css">
    <script>
        // Динамическое изменение названия в зависимости от домена
        document.addEventListener('DOMContentLoaded', function() {
            const hostname = window.location.hostname;
            const brandElement = document.getElementById('navbarBrand');
            
            if (brandElement) {
                if (hostname.includes('audio-chat.ru')) {
                    brandElement.textContent = 'Audio Chat';
                } else if (hostname.includes('audio-kostya.online')) {
                    brandElement.textContent = 'Audio Kostya';
                }
                // По умолчанию остается "Audio Kostya" если домен не распознан
            }
        });
    </script>
</head>
<body>
    <div class="page-container">
        <div class="maintenance-banner" role="alert">
            <div class="maintenance-banner__title">🍫 Ведутся технические шоколадки</div>
            <p class="maintenance-banner__text">Почему-то упала система авторизации. Завтра надеюсь починю.</p>
        </div>
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand" id="navbarBrand">Audio Kostya</div>
                <ul class="navbar-nav">
                    <li><a href="login.html">Вход</a></li>
                </ul>
            </div>
        </nav>

        <main class="content">
            <div class="container" style="max-width: 500px;">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Регистрация</h2>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="form-group">
                                <label class="form-label" for="nickName">Никнейм</label>
                                <input 
                                    type="text" 
                                    id="nickName" 
                                    name="nickName" 
                                    class="form-input" 
                                    required
                                    autocomplete="username"
                                    autofocus
                                    minlength="1"
                                    maxlength="30"
                                >
                                <div class="form-help">1-30 символов</div>
                                <div class="form-error" id="nickNameError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">Пароль</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    required
                                    autocomplete="new-password"
                                    minlength="6"
                                >
                                <div class="form-help">Минимум 6 символов</div>
                                <div class="form-error" id="passwordError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    class="form-input" 
                                    required
                                    autocomplete="new-password"
                                >
                                <div class="form-error" id="confirmPasswordError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="email">Email (необязательно)</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-input" 
                                    autocomplete="email"
                                >
                                <div class="form-help">Для восстановления пароля</div>
                                <div class="form-error" id="emailError"></div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary" style="width: 100%;">
                                    Зарегистрироваться
                                </button>
                            </div>

                            <div class="text-center">
                                <p style="color: var(--text-secondary); font-size: 13px;">
                                    Уже есть аккаунт? <a href="login.html">Войти</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            document.querySelectorAll('.form-error').forEach(el => {
                el.textContent = '';
            });

            const nickName = document.getElementById('nickName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const email = document.getElementById('email').value.trim() || null;

            let hasError = false;

            if (!nickName) {
                document.getElementById('nickNameError').textContent = 'Никнейм обязателен';
                hasError = true;
            } else if (nickName.length > 30) {
                document.getElementById('nickNameError').textContent = 'Максимум 30 символов';
                hasError = true;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Минимум 6 символов';
                hasError = true;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
                hasError = true;
            }

            if (hasError) return;

            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Регистрация...';

            try {
                await Auth.register(nickName, password, confirmPassword, email);
                setTimeout(() => {
                    window.location.href = 'groups.html';
                }, 1000);
            } catch (error) {
                submitButton.disabled = false;
                submitButton.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>
</html>
