<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Audio Chat</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="page-container">
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand">Audio Chat</div>
                <ul class="navbar-nav">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="login.html">Вход</a></li>
                </ul>
            </div>
        </nav>

        <main class="content">
            <div class="container" style="max-width: 500px;">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Регистрация</h2>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="form-group">
                                <label class="form-label" for="email">Email</label>
                                <input 
                                    type="email" 
                                    id="email" 
                                    name="email" 
                                    class="form-input" 
                                    required
                                    autocomplete="email"
                                >
                                <div class="form-error" id="emailError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="nickName">Имя пользователя</label>
                                <input 
                                    type="text" 
                                    id="nickName" 
                                    name="nickName" 
                                    class="form-input" 
                                    required
                                    autocomplete="username"
                                >
                                <div class="form-error" id="nickNameError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">Пароль</label>
                                <input 
                                    type="password" 
                                    id="password" 
                                    name="password" 
                                    class="form-input" 
                                    required
                                    autocomplete="new-password"
                                    minlength="6"
                                >
                                <div class="form-help">Минимум 6 символов</div>
                                <div class="form-error" id="passwordError"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                                <input 
                                    type="password" 
                                    id="confirmPassword" 
                                    name="confirmPassword" 
                                    class="form-input" 
                                    required
                                    autocomplete="new-password"
                                >
                                <div class="form-error" id="confirmPasswordError"></div>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn btn-primary" style="width: 100%;">
                                    Зарегистрироваться
                                </button>
                            </div>

                            <div class="text-center">
                                <p style="color: var(--text-secondary); font-size: 13px;">
                                    Уже есть аккаунт? <a href="login.html">Войти</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Очистка предыдущих ошибок
            document.querySelectorAll('.form-error').forEach(el => {
                el.textContent = '';
            });

            const email = document.getElementById('email').value.trim();
            const nickName = document.getElementById('nickName').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Валидация
            let hasError = false;

            if (!email) {
                document.getElementById('emailError').textContent = 'Email обязателен';
                hasError = true;
            }

            if (!nickName) {
                document.getElementById('nickNameError').textContent = 'Имя пользователя обязательно';
                hasError = true;
            }

            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Пароль должен содержать минимум 6 символов';
                hasError = true;
            }

            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
                hasError = true;
            }

            if (hasError) return;

            // Отправка формы
            const submitButton = e.target.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Регистрация...';

            try {
                await Auth.register(email, password, nickName, confirmPassword);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                submitButton.disabled = false;
                submitButton.textContent = 'Зарегистрироваться';
            }
        });
    </script>
</body>
</html>
